baseURL = "https://aemukit.me/"
theme = "hugo-bearblog"
title = "aemukit"
author = "aemukit"
languageCode = "en-US"
enableRobotsTXT = true
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/blog/:slug/"
  thoughts = "/thoughts/:slug/"
  plans = "/plans/:slug/"

[params]
  showAllPostsOnHomePage = true
  description = "Embracing imperfections, building a future within them ~ Abdul Mukit"
  hideMadeWithLine = true
  favicon = "images/favicon.webp"
  enableRobotsTXT = true

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"
